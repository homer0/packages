packages:
  - packages/public/*
  - packages/personal/*

minimumReleaseAge: 7200 # 5 days
minimumReleaseAgeExclude:
  - '@homer0/*'

catalog:
  '@earendil-works/pi-coding-agent': 1.5.0
  '@earendil-works/pi-tui': 1.5.0
  '@testing-library/react': ^16.3.3
  '@types/jest': ^30.0.0
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  eslint: ^9.39.5
  oxlint: ^1.90.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: 0.23.4
  typescript: ^6.0.3

  # Vite and Vitest
  '@vitejs/plugin-react': ^6.2.1
  '@vitest/coverage-v8': ^5.1.0
  vite: ^8.3.5
  vitest: ^5.1.0
  unplugin-swc: ^2.0.0
  jsdom: ^30.1.3

overrides:
  # Pi 1.1.0 expects declarations removed in pi-codemode 1.2.0.
  '@earendil-works/pi-coding-agent@1.1.0>@earendil-works/pi-codemode': '1.1.0'
  'brace-expansion@^5.0.0': '^5.0.5'

allowBuilds:
  # For pi-ai. It has a preinstall with a no-op message.
  '@google/genai': false
  # For @google/genai. It validates the required version of the package.
  protobufjs: true
  # For downloading the correct binary for the platform.
  '@swc/core': true
  # For vite. Its postinstall selects the platform-specific esbuild binary.
  esbuild: true
  # For lerna. It does some nx checks for their cloud thing.
  nx: false
  # For ESLint. Configures path resolvers bindings using napi.
  unrs-resolver: true
