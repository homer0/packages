packages:
  - packages/public/*
  - packages/personal/*

minimumReleaseAge: 7200 # 5 days
minimumReleaseAgeExclude:
  - '@homer0/*'

catalog:
  '@earendil-works/pi-coding-agent': 1.4.0
  '@earendil-works/pi-tui': 1.4.0
  '@testing-library/react': ^16.3.3
  '@types/jest': ^30.0.0
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  eslint: ^9.39.5
  oxlint: ^1.89.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: 0.23.2
  typescript: ^6.0.3

  # Vite and Vitest
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-v8': ^5.0.5
  vite: ^8.3.5
  vitest: ^5.0.5
  unplugin-swc: ^2.0.0
  jsdom: ^30.1.3

overrides:
  # Pi 1.1.0 expects declarations removed in pi-codemode 1.2.0.
  '@earendil-works/pi-coding-agent@1.1.0>@earendil-works/pi-codemode': '1.1.0'
  # The newer SSO provider requires an unpublished token-providers version.
  '@aws-sdk/token-providers': '3.1149.0'
  'brace-expansion@^5.0.0': '^5.0.5'
  'yaml@^2.0.0': '^2.8.3'
  'follow-redirects@^1.0.0': '^1.16.0'
  '@typescript-eslint/types@^8.71.2': '8.70.1'
  '@typescript-eslint/visitor-keys@^8.71.2': '8.70.1'

allowBuilds:
  # For pi-ai. It has a preinstall with a no-op message.
  '@google/genai': false
  # For @google/genai. It validates the required version of the package.
  protobufjs: true
  # For downloading the correct binary for the platform.
  '@swc/core': true
  # For vite. Its postinstall selects the platform-specific esbuild binary.
  esbuild: true
  # For lerna. It does some nx checks for their cloud thing.
  nx: false
  # For ESLint. Configures path resolvers bindings using napi.
  unrs-resolver: true
