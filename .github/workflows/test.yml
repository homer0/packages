name: Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24', '26']
    name: Run tests and linter (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run format:check
      - run: pnpm run lint:all
      - run: pnpm run types:check
      - run: pnpm test -- --coverage
      - name: Save coverage reports
        if: ${{ matrix.node == '24' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/public/*/coverage/lcov.info
          if-no-files-found: error

  prepare-coverage:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Discover packages with coverage
        id: discover
        shell: bash
        run: |
          packages=$(find coverage -mindepth 3 -maxdepth 3 -type f -path 'coverage/*/coverage/lcov.info' \
            | jq -Rsc 'split("\n") | map(select(length > 0) | split("/")[1]) | sort | unique')
          if [[ "$packages" == '[]' ]]; then
            echo 'No public package coverage reports found.' >&2
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  coverage:
    needs: prepare-coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare-coverage.outputs.packages) }}
    name: Coveralls for public/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: packages/public
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel: true
          flag-name: public-${{ matrix.package }}
          file: packages/public/${{ matrix.package }}/coverage/lcov.info
          base-path: packages/public/${{ matrix.package }}

  finish:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
